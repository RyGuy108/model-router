name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      ROUTER_TEST_PG: postgresql://postgres:postgres@localhost/router_test
      ROUTER_TEST_REDIS: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Unit and integration tests
        run: pytest -q
      - name: Pipeline smoke test (simulate -> train -> offline benchmark)
        run: |
          python -m sim.world --n 3000 --out /tmp/eval.jsonl
          python -m router.train --data /tmp/eval.jsonl --epochs 1 --emb 16 --buckets-log2 12 --out /tmp/passnet.pt
          python - <<'PY'
          from router.model import load_bytes
          net, meta = load_bytes(open("/tmp/passnet.pt", "rb").read())
          assert meta["arch"]["buckets"] == 4096, meta
          print("trained", meta["version"])
          PY
